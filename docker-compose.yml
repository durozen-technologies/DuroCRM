services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:?Set NODE_ENV in .env.docker}
      PORT: ${BACKEND_PORT:?Set BACKEND_PORT in .env.docker}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.docker}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      JWT_EXPIRES_IN_MINUTES: ${JWT_EXPIRES_IN_MINUTES:?Set JWT_EXPIRES_IN_MINUTES in .env.docker}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in .env.docker}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    ports:
      - "${BACKEND_HOST_PORT:-4000}:${BACKEND_PORT}"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env.docker}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:?Set NODE_ENV in .env.docker}
      HOSTNAME: ${FRONTEND_HOSTNAME:?Set FRONTEND_HOSTNAME in .env.docker}
      PORT: ${FRONTEND_PORT:?Set FRONTEND_PORT in .env.docker}
    depends_on:
      - backend
    networks:
      - default
      - dokploy-network
    ports:
      - "${FRONTEND_HOST_PORT:-3001}:${FRONTEND_PORT}"

volumes:
  postgres_data:

networks:
  default:
  dokploy-network:
    external: true
